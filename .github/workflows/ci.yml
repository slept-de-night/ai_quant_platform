name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  go-engine:
    name: Go Execution Core Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The Go module (services/aq-engine-go) is stdlib-only and has no
          # go.sum dependency manifest. Disable the dependency cache so
          # setup-go does not warn that it cannot find a Go dependency file
          # at the repository root.
          cache: 'false'

      - name: Go Vet & Test Execution Suite
        run: |
          cd services/aq-engine-go
          go vet ./...
          go test -v -race -count=1 ./...

  python-research:
    name: Python Quantitative Research Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Suite
        run: |
          python -m pytest -v -q

  frontend-workstation:
    name: Frontend Workstation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
