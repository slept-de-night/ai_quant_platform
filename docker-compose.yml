services:
  aq-engine-go:
    build:
      context: ./services/aq-engine-go
      dockerfile: Dockerfile
    container_name: aq_engine_go
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8080
      - STARTING_EQUITY=100000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 3s

  ai-quant-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_quant_platform_v1_2
    restart: unless-stopped
    depends_on:
      aq-engine-go:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data/ai_quant.sqlite3
      - AGENT_MEMORY_DIR=/app/agent_memory
      - GO_ENGINE_URL=http://aq-engine-go:8080
    volumes:
      - ./data:/app/data
      - ./agent_memory:/app/agent_memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
